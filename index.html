<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Pomodoro Timer</title>
    
    <!-- ファビコン（トマトの絵文字をSVGとしてインライン指定） -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%%22 y=%2250%%22 style=%22dominant-baseline:central;text-anchor:middle;font-size:90px;%22>🍅</text></svg>">
    
    <!-- OGP (Open Graph Protocol) -->
    <meta property="og:title" content="Visual Pomodoro Timer">
    <meta property="og:description" content="音声入力とAIとの壁打ち（Voice Driven Development）のみで構築された、完全オリジナルのポモドーロタイマー。環境音の自動生成機能を搭載。">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://raw.githubusercontent.com/Ushi54/pomodoro-timer/main/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Fonts for Organic Theme -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Visual Pomodoro</h1>
            <div class="controls">
                <button id="toggle-ui-btn" class="btn">UI切り替え (時計 / メーター)</button>
            </div>
        </header>

        <main>
            <!-- 時計型UI (TIME TIMER風) -->
            <div id="ui-clock" class="ui-container active">
                <div class="clock-wrapper">
                    <svg class="clock-svg" viewBox="0 0 100 100">
                        <!-- 背景の円 -->
                        <circle cx="50" cy="50" r="45" class="clock-bg" />
                        <!-- 背景として常に存在する赤/緑のベース円弧 -->
                        <circle cx="50" cy="50" r="45" class="clock-base" id="clock-base" />
                        <!-- 上から白で塗りつぶしていく（時計回りに赤が減るように見せるためのマスク） -->
                        <circle cx="50" cy="50" r="45" class="clock-progress-mask" id="clock-progress" />
                        <!-- 目盛りと数字はJSで動的に追加 -->
                        <g id="clock-marks"></g>
                    </svg>
                    <div class="clock-center">
                        <span id="clock-time-display">25:00</span>
                    </div>
                </div>
            </div>

            <!-- メーター型UI (ビジュアルバータイマー風) -->
            <div id="ui-meter" class="ui-container">
                <div class="meter-wrapper">
                    <div class="meter-track">
                        <!-- 目盛り -->
                        <div id="meter-grid" class="meter-grid"></div>
                        <!-- 減っていくバー -->
                        <div class="meter-fill" id="meter-fill"></div>
                    </div>
                    <div class="meter-label">
                        <span id="meter-time-display">25</span><span class="meter-unit">min</span>
                    </div>
                </div>
            </div>

            <!-- 操作パネル -->
            <div class="panel">
                <div class="status-indicator">
                    <h2 id="current-status">作業中 (Focus)</h2>
                </div>
                
                <div class="actions">
                    <button id="start-btn" class="btn primary">スタート</button>
                    <button id="pause-btn" class="btn" disabled>一時停止</button>
                    <button id="reset-btn" class="btn">リセット</button>
                    <button id="skip-btn" class="btn">すぐ休憩に入る</button>
                </div>

                <div class="settings">
                    <div class="setting-group">
                        <label for="work-time">作業時間 (分)</label>
                        <input type="number" id="work-time" value="25" min="1" max="120">
                    </div>
                    <div class="setting-group">
                        <label for="break-time">休憩時間 (分)</label>
                        <input type="number" id="break-time" value="5" min="1" max="60">
                    </div>
                    <div class="setting-group">
                        <label for="bgm-select">BGM設定 (作業中)</label>
                        <select id="bgm-select">
                            <option value="brown">ブラウンノイズ</option>
                            <option value="white">ホワイトノイズ</option>
                            <option value="none">なし</option>
                        </select>
                    </div>
                </div>
            </div>
        </main>
        <footer class="app-footer">
            <p>Created by Ushi &middot; <a href="https://github.com/Ushi54/pomodoro-timer" target="_blank" rel="noopener">GitHub</a></p>
        </footer>
    </div>
    <script src="pomodoro.js"></script>
</body>
</html>
